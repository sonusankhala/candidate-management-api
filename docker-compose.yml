services:
  mysql:
    image: mysql:8.0
    container_name: candidate-mysql
    environment:
      MYSQL_DATABASE: candidatedb
      MYSQL_USER: candidate_user
      MYSQL_PASSWORD: candidate_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mysqldata:
